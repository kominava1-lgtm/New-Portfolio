name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main  # Change this to master if your branch is named master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true # This downloads your real video safely in the cloud!

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Serves your whole repository folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
